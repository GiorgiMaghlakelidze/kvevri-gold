name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test engine
        run: dotnet test --configuration Release

      - name: Publish Blazor WebAssembly app
        run: dotnet publish src/KvevriGold.Web/KvevriGold.Web.csproj --configuration Release --output publish

      - name: Prepare for GitHub Pages (base path, .nojekyll, 404 fallback)
        run: |
          cd publish/wwwroot
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' index.html
          grep -q '<base href="/${{ github.event.repository.name }}/" />' index.html
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
